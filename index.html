
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111a;
      color: white;
      text-align: center;
      padding: 80px 20px;
    }

    h1 {
      font-size: 48px;
      color: #8b7cff;
    }

    p {
      color: #c5c5d6;
      font-size: 18px;
    }

    button {
      background: #8b7cff;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>My Website</h1>
  <p>Welcome to my brand-new website!</p>
  <button onclick="alert('It works!')">Click Me</button>
</body>
</html>
